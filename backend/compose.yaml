name: expense-splitter

services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_DB: expense_splitter
      POSTGRES_USER: expense_splitter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL.}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_splitter -d expense_splitter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
